name: バスケ部管理アプリ テスト

on:
  push:
    paths:
      - "バスケ部管理アプリ/**"
      - ".github/workflows/バスケ部管理アプリ_テスト.yml"
  pull_request:
    paths:
      - "バスケ部管理アプリ/**"
      - ".github/workflows/バスケ部管理アプリ_テスト.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: テストを実行
        working-directory: バスケ部管理アプリ
        run: python -m unittest テスト_バスケ部管理アプリ -v
